<!DOCTYPE html>
<html lang="en">

            gap: 20px;
        }

            border-radius: 15px;
            text-align: center;
        }

        .project h3 {
            color: #ff69b4;
            margin-bottom: 10px;
        }

        .project p {
            color: #ccc;
        }

        .contact {
            text-align: center;
        }

        .contact p {
            color: #ccc;
            margin: 10px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #15151d;
            color: #aaa;
        }
